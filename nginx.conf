root /app/dist;
index index.html;

# Behind the Scalingo router nginx listens on an internal port: never put it in redirects
absolute_redirect off;
port_in_redirect off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

location /_astro/ {
  expires 1y;
}

# Removed solution pages
location ~ ^/solutions/(technical-consulting|commodity-trading)/?$ {
  return 301 /solutions/energy-assets/;
}

location ~ ^/customers/due-diligence/?$ {
  return 301 /solutions/energy-assets/;
}

location ~ ^/resources/brief/?$ {
  return 301 /product/;
}

location ~ ^/company/contact/?$ {
  return 301 /#contact;
}

# Docs pages moved into sections
location ~ ^/docs/concepts/?$ { return 301 /docs/getting-started/concepts/; }
location ~ ^/docs/links/?$ { return 301 /docs/ontology/links/; }
location ~ ^/docs/writing-a-rule/?$ { return 301 /docs/rules/writing-a-rule/; }
location ~ ^/docs/azure-deployment/?$ { return 301 /docs/deployment/azure/; }

location / {
  # Serve /page from /page/index.html directly, without a trailing-slash redirect
  try_files $uri $uri/index.html $uri.html =404;
}

error_page 404 /404.html;
