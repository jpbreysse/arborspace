root /app/dist;
index index.html;

# Behind the Scalingo router nginx listens on an internal port: never put it in redirects
absolute_redirect off;
port_in_redirect off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

location /_astro/ {
  expires 1y;
}

location / {
  # Serve /page from /page/index.html directly, without a trailing-slash redirect
  try_files $uri $uri/index.html $uri.html =404;
}

error_page 404 /404.html;
